# Single-server production (any VPS with Docker): Caddy (automatic HTTPS) →
# app; worker; Postgres; Redis. Only Caddy publishes ports.
#
#   cp .env.example .env.production   # fill it in: see docs/DEPLOY.md#vps
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#   docker compose -f docker-compose.prod.yml --env-file .env.production exec app npm run db:seed   # first time only
#
# Local media storage works here (app and worker share the `media` volume),
# but S3/R2 is still recommended so media survives a lost server.
x-app: &app
  build: .
  image: postpilot:latest
  env_file: .env.production
  restart: unless-stopped
  environment: &app-env
    NODE_ENV: production
    DATABASE_URL: postgresql://postpilot_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@postgres:5432/postpilot?schema=public
    DIRECT_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/postpilot?schema=public
    REDIS_URL: redis://redis:6379
    STORAGE_LOCAL_DIR: /app/.data/media
  volumes: [media:/app/.data/media]
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN, e.g. app.example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app: { condition: service_healthy }

  app:
    <<: *app
    command: ["app"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 10
      start_period: 40s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    <<: *app
    command: ["worker"]
    environment:
      <<: *app-env
      WORKER_HEALTH_PORT: "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      retries: 5
    depends_on:
      app: { condition: service_healthy } # the app runs migrations first

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postpilot
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-prod.sh:/docker-entrypoint-initdb.d/01-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF persistence + noeviction: BullMQ must never have its keys evicted.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
  media:
  caddy_data:
  caddy_config:
