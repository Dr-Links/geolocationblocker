name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # cPanel servers often ship older PostgreSQL; 13 is the minimum we support.
        postgres: ['13', '16']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_PG_HOST: localhost
      TEST_PG_PORT: '5432'
      TEST_PG_SUPERUSER: postgres
      TEST_PG_PASSWORD: postgres
      MAILTEST_EXTERNAL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Start test IMAP server (Dovecot)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q dovecot-imapd
          sudo systemctl stop dovecot || true
          sudo bash apps/backend/test/mailserver/start-dovecot.sh
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -w @app/backend
      - run: npm run build
      - run: node deploy/cpanel/package.mjs
      - name: Upload cPanel deployment folder
        if: matrix.postgres == '16'
        uses: actions/upload-artifact@v4
        with:
          name: emailplatform-cpanel
          path: deploy/cpanel/out/emailplatform
          retention-days: 30

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo export --platform android --output-dir /tmp/expo-export
      - run: npx expo export --platform web --output-dir /tmp/expo-web

  # The real web app (PWA) build in Chromium against the real backend and IMAP server.
  pwa-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_PG_HOST: localhost
      TEST_PG_PORT: '5432'
      TEST_PG_SUPERUSER: postgres
      TEST_PG_PASSWORD: postgres
      MAILTEST_EXTERNAL: '1'
      WEB_E2E_DIR: /tmp/awm-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Start test IMAP server (Dovecot)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q dovecot-imapd
          sudo systemctl stop dovecot || true
          sudo bash apps/backend/test/mailserver/start-dovecot.sh
      - run: npm ci
      - name: Build the web app
        working-directory: apps/mobile
        run: npm ci && npx expo export --platform web --output-dir /tmp/awm-web
      - name: Install Playwright (Chromium)
        run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Browser test
        working-directory: apps/backend
        run: npx vitest run test/e2e/pwa.test.ts

  # The production server image (deploy/server/Dockerfile), smoke-tested against PostgreSQL.
  docker-image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f deploy/server/Dockerfile -t allwebmails:ci .
      - name: Smoke test (migrate, serve the web app, pg_dump present)
        run: bash deploy/server/smoke-test.sh allwebmails:ci
