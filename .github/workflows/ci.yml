name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: socialai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      CI: "true"
      NODE_ENV: test
      APP_URL: http://localhost:3100
      # Runtime role (RLS enforced) vs owner role (migrations).
      DATABASE_URL: postgresql://postpilot_app:postpilot_app@localhost:5432/socialai?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/socialai?schema=public
      TEST_DATABASE_URL: postgresql://postpilot_app:postpilot_app@localhost:5432/socialai?schema=public
      REDIS_URL: redis://localhost:6379
      AUTH_TRUST_HOST: "true"
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate ephemeral secrets
        run: |
          echo "AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Create runtime DB role
        run: psql "$DIRECT_DATABASE_URL" -f docker/postgres/init.sql
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Migrate + seed
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff --from-url "$DIRECT_DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code \
            || (echo "::error::schema.prisma has changes without a migration" && exit 1)
          npm run db:seed
      - name: Unit + integration tests
        run: npm test
      - run: npm run build
        env:
          NODE_ENV: production
      - run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npm run test:e2e
        env:
          NODE_ENV: production
          E2E_PORT: "3100"

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ai-social-manager:ci .
