# Local dev stack: app + worker + postgres + redis.
#   cp .env.example .env   # fill AUTH_SECRET and ENCRYPTION_KEY
#   docker compose up --build
#   docker compose exec app npm run db:seed
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: socialai
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postpilot_app:postpilot_app@postgres:5432/socialai?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/socialai?schema=public
      REDIS_URL: redis://redis:6379
      SERVICE_NAME: app
      STORAGE_LOCAL_DIR: /app/.data/media
    ports: ["3000:3000"]
    # Local media storage is shared with the worker (unused once S3/R2 is configured).
    volumes: [media:/app/.data/media]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 10
      start_period: 30s

  worker:
    build: .
    command: ["npm", "run", "worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postpilot_app:postpilot_app@postgres:5432/socialai?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/socialai?schema=public
      REDIS_URL: redis://redis:6379
      SERVICE_NAME: worker
      STORAGE_LOCAL_DIR: /app/.data/media
      WORKER_HEALTH_PORT: "3001"
    volumes: [media:/app/.data/media]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      retries: 5
    depends_on:
      app: { condition: service_healthy } # app runs migrations first
      redis: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  media:
